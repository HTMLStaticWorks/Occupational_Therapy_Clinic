<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal Login | RehabNest Occupational Therapy</title>
  <meta name="description" content="Log into your secure RehabNest Patient Portal to view assigned home exercise programs, therapist notes, and upcoming sessions.">
  
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div class="auth-wrapper" style="position: relative;">
    <!-- Theme & Layout Toggles -->
    <div class="auth-top-actions" style="position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.75rem; z-index: 100;">
      <button class="toggle-btn" id="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Light/Dark Theme"><i class="fas fa-moon"></i></button>
      <button class="toggle-btn" id="rtl-toggle" aria-label="Toggle RTL" title="Toggle LTR/RTL Layout"><i class="fas fa-globe"></i></button>
    </div>

    <div class="auth-card" data-animate="fade-in">
      <a href="index.html" class="brand-logo auth-brand">
        <i class="fas fa-hand-holding-heart"></i>
        <span>RehabNest</span>
      </a>

      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Log in to access your patient portal, exercises, & progress notes.</p>

      <form data-validate action="dashboard.html" method="GET">
        <div class="form-group text-left" style="text-align: left;">
          <label class="form-label">Email Address *</label>
          <input type="email" class="form-control" required placeholder="patient@example.com">
          <span class="form-error">Please enter a valid email address</span>
        </div>

        <div class="form-group text-left" style="text-align: left;">
          <label class="form-label">Password *</label>
          <div class="password-input-wrapper">
            <input type="password" name="password" class="form-control" required placeholder="••••••••">
            <i class="fas fa-eye password-toggle-icon"></i>
          </div>
          <span class="form-error">Password is required</span>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.875rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox" style="accent-color: var(--primary);"> Remember Me
          </label>
          <a href="#" style="color: var(--secondary); font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">
          <i class="fas fa-sign-in-alt"></i> Login to Portal
        </button>
      </form>

      <div class="auth-divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <div class="social-auth-grid">
        <button class="social-auth-btn" title="Sign in with Google"><i class="fab fa-google" style="color: #EA4335;"></i></button>
        <button class="social-auth-btn" title="Sign in with Apple"><i class="fab fa-apple"></i></button>
        <button class="social-auth-btn" title="Sign in with Facebook"><i class="fab fa-facebook-f" style="color: #1877F2;"></i></button>
      </div>

      <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 1.5rem;">
        Don't have a patient account? <a href="signup.html" style="color: var(--primary); font-weight: 700;">Sign Up Here</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
